<style>
:root{--brand:#0f3d56;--accent:#0f9b8e;--bg:#f4f7f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2c3e;padding:16px}
.card{background:#fff;border-radius:16px;box-shadow:0 6px 30px rgba(15,61,86,.12);padding:32px 28px;width:100%;max-width:380px;text-align:center}

p{margin:0 0 22px;color:#5b6b7a;font-size:15px}
input{width:100%;font-size:22px;letter-spacing:6px;text-align:center;padding:14px;border:1.5px solid #c9d4dd;border-radius:12px;outline:none}
input:focus{border-color:var(--accent)}
button{margin-top:14px;width:100%;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#b23b3b;font-size:14px;min-height:20px;margin-top:12px}
</style>

function b64(x){var s=atob(x),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a}
async function open_(pw){
  var e=new TextEncoder();
  var base=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},key,b64(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function tryPw(pw,quiet){
  var b=document.getElementById("go"),er=document.getElementById("err");
  b.disabled=true;b.textContent="Wird geöffnet …";er.textContent="";
  try{var h=await open_(pw);try{sessionStorage.setItem("hpzdemo",pw)}catch(x){}show(h);}
  catch(x){b.disabled=false;b.textContent="Öffnen";if(!quiet)er.textContent="Code falsch – bitte erneut versuchen.";}
}
